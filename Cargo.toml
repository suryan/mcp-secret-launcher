[package]
name = "mcp-secret-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
clap = { version = "4", features = ["derive"] }
secrecy = "0.10"
rpassword = "5"
anyhow = "1"
thiserror = "2"
serde_json = "1"
sha2 = "0.10.9"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
open = "5.3.3"
fs4 = "0.13.1"
ctrlc = "3.5.2"
serde = { version = "1.0.228", features = ["derive"] }
ureq = { version = "2.9.7", features = ["json", "tls"] }

[features]
test-utils = []

[dev-dependencies]
proptest = "1"
mockito = "1"
temp-env = "0.3.6"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)', 'cfg(coverage)'] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
too_many_lines = "allow"
similar_names = "allow"
unused_async = "allow"
